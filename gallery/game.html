<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plink run · plinkfx 사운드로 만든 30초 게임</title>
    <meta name="description" content="모든 사운드가 plinkfx인 30초 러너: 점프, 코인, 몬스터 밟기, 파워업. 오디오 파일 없음." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:image" content="https://sigco3111.github.io/plinkfx/social-preview.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16130f;
        color: #f2ede3;
        font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100%;
      }
      header,
      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: #a39a8c;
        flex-wrap: wrap;
      }
      a {
        color: #f2ede3;
        text-underline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid #ff5a26;
        outline-offset: 2px;
      }
      header {
        align-items: center;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        min-height: 44px;
        text-decoration: none;
      }
      .back img {
        height: 26px;
        width: auto;
        image-rendering: pixelated;
      }
      .back span {
        text-decoration: underline;
      }
      kbd {
        font: inherit;
        font-size: 0.8em;
        padding: 0.1em 0.4em;
        border: 1px solid #4d453b;
        border-bottom-width: 2px;
        color: #f2ede3;
      }
      main {
        display: grid;
        place-items: center;
        padding: 0 0.5rem;
      }
      canvas {
        width: min(100%, 177.8vh - 12rem, 1280px);
        aspect-ratio: 16 / 9;
        image-rendering: pixelated;
        border: 1px solid #3a342c;
        background: #1b1713;
        touch-action: manipulation;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="./"><img src="lockup-dark.svg" alt="plinkfx" width="231" height="66" /><span>갤러리로 돌아가기</span></a>
      <span><kbd>space</kbd> 또는 탭: 점프, 두 번 누르면 2단 점프. <kbd>m</kbd> 음소거</span>
    </header>
    <main><canvas id="c" width="640" height="360" aria-label="plink run 게임" tabindex="0"></canvas></main>
    <footer>
      <span>이 게임의 모든 사운드는 plinkfx 사운드를 실시간으로 합성합니다. 자막에 각 사운드 이름이 표시됩니다.</span>
      <a href="https://github.com/maximilianfeix/plinkfx/blob/main/gallery/game.ts">소스</a>
    </footer>
    <script type="module" src="./game.ts"></script>
  </body>
</html>
